<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reproductor de música</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    .contenedor {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      box-sizing: border-box;
    }
    iframe {
      width: 100%;
      max-width: 700px;
      height: 166px;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <!--
      Reproductor oficial de SoundCloud.
      El usuario pulsa el Play DENTRO del propio reproductor: ese clic
      es el que Chrome necesita para permitir el audio dentro de Google Sites.
    -->
    <iframe
      title="Reproductor de SoundCloud"
      allow="autoplay; encrypted-media"
      src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/brunomars/just-the-way-you-are-7&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false&visual=false">
    </iframe>
  </div>
</body>
</html>
